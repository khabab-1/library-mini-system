services:
  - type: web
    name: library-mini-system
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/library.db
    disk:
      name: library-data
      mountPath: /var/data
      sizeGB: 1
